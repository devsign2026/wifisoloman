<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #000; }
    * { -webkit-font-smoothing: antialiased; box-sizing: border-box; }
    a { color: #0A84FF; } a:hover { color: #409CFF; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #000000; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #FFFFFF; display: flex; flex-direction: column; overflow: hidden;">

  <div style="height: 50px; flex-shrink: 0;"></div>

  <div style="padding: 0 20px 14px 20px; font-size: 34px; font-weight: 700; letter-spacing: -0.4px;">설정</div>

  <div style="flex-grow: 1; overflow: hidden; padding: 0 20px; display: flex; flex-direction: column; gap: 18px;">

    <div>
      <div style="font-size: 13px; color: rgba(235,235,245,0.5); letter-spacing: 0.3px; padding: 0 4px 7px 4px;">감지</div>
      <div style="background: #1C1C1E; border-radius: 16px; padding: 15px 16px 17px 16px;">
        <div style="display: flex; align-items: baseline; justify-content: space-between;">
          <div style="font-size: 16px;">임계값</div>
          <div style="font-size: 16px; color: rgba(235,235,245,0.6); font-variant-numeric: tabular-nums;">0.760</div>
        </div>
        <div style="position: relative; margin-top: 14px; height: 28px;">
          <div style="position: absolute; top: 11px; left: 0; right: 0; height: 4px; border-radius: 2px; background: rgba(120,120,128,0.32);"></div>
          <div style="position: absolute; top: 11px; left: 0; width: 56%; height: 4px; border-radius: 2px; background: #0A84FF;"></div>
          <div style="position: absolute; top: 1px; left: 56%; width: 26px; height: 26px; margin-left: -13px; border-radius: 13px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,0.45);"></div>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 11.5px; color: rgba(235,235,245,0.4); font-variant-numeric: tabular-nums;">
          <span>0.40 · 민감</span><span>1.40 · 둔감</span>
        </div>
        <div style="margin-top: 13px; padding-top: 13px; border-top: 1px solid rgba(84,84,88,0.32); font-size: 12.5px; line-height: 1.45; color: rgba(235,235,245,0.55);">
          현재 기준선 <span style="color: rgba(235,235,245,0.85); font-variant-numeric: tabular-nums;">0.579</span> · 빈 방 최대 <span style="color: rgba(235,235,245,0.85); font-variant-numeric: tabular-nums;">0.721</span>
        </div>
      </div>
    </div>

    <div>
      <div style="font-size: 13px; color: rgba(235,235,245,0.5); letter-spacing: 0.3px; padding: 0 4px 7px 4px;">기준선</div>
      <div style="background: #1C1C1E; border-radius: 16px; overflow: hidden;">
        <div style="display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid rgba(84,84,88,0.28);">
          <div style="flex-grow: 1;">
            <div style="font-size: 16px; color: #0A84FF;">기준선 재측정</div>
            <div style="font-size: 12.5px; color: rgba(235,235,245,0.5); margin-top: 2px;">빈 방에서 7분간 측정합니다</div>
          </div>
          <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="rgba(235,235,245,0.3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg>
        </div>
        <div style="display: flex; align-items: center; padding: 14px 16px;">
          <div style="flex-grow: 1; font-size: 16px;">분석 창 길이</div>
          <div style="display: flex; align-items: center; gap: 7px;">
            <div style="font-size: 16px; color: rgba(235,235,245,0.6); font-variant-numeric: tabular-nums;">30초</div>
            <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="rgba(235,235,245,0.3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg>
          </div>
        </div>
      </div>
      <div style="font-size: 12px; color: rgba(235,235,245,0.42); line-height: 1.45; padding: 8px 6px 0 6px;">
        장비 위치를 옮기면 기준선이 무효가 됩니다. 반드시 다시 측정하세요.
      </div>
    </div>

    <div>
      <div style="font-size: 13px; color: rgba(235,235,245,0.5); letter-spacing: 0.3px; padding: 0 4px 7px 4px;">알림</div>
      <div style="background: #1C1C1E; border-radius: 16px; overflow: hidden;">
        <div style="display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid rgba(84,84,88,0.28);">
          <div style="flex-grow: 1; font-size: 16px;">움직임 감지 알림</div>
          <div style="width: 51px; height: 31px; border-radius: 16px; background: #30D158; position: relative; flex-shrink: 0;">
            <div style="position: absolute; top: 2px; left: 22px; width: 27px; height: 27px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 2px 5px rgba(0,0,0,0.3);"></div>
          </div>
        </div>
        <div style="display: flex; align-items: center; padding: 12px 16px;">
          <div style="flex-grow: 1;">
            <div style="font-size: 16px;">장비 연결 끊김 알림</div>
            <div style="font-size: 12.5px; color: rgba(235,235,245,0.5); margin-top: 1px;">1분 이상 응답 없을 때</div>
          </div>
          <div style="width: 51px; height: 31px; border-radius: 16px; background: rgba(120,120,128,0.32); position: relative; flex-shrink: 0;">
            <div style="position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 2px 5px rgba(0,0,0,0.3);"></div>
          </div>
        </div>
      </div>
    </div>


  </div>

  <div style="flex-shrink: 0; height: 83px; background: rgba(22,22,24,0.94); border-top: 1px solid rgba(84,84,88,0.4); display: flex; padding: 8px 0 0 0;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="rgba(235,235,245,0.4)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h3l2.5-7 4 14 2.5-7H21"/></svg>
      <div style="font-size: 10px; color: rgba(235,235,245,0.4);">모니터</div>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="rgba(235,235,245,0.4)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="3.6" cy="6" r="1.3"/><circle cx="3.6" cy="12" r="1.3"/><circle cx="3.6" cy="18" r="1.3"/></svg>
      <div style="font-size: 10px; color: rgba(235,235,245,0.4);">기록</div>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="rgba(235,235,245,0.4)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="13" rx="2.2"/><path d="M8 21h8"/><path d="M12 18v3"/></svg>
      <div style="font-size: 10px; color: rgba(235,235,245,0.4);">장비</div>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#0A84FF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
      <div style="font-size: 10px; color: #0A84FF; font-weight: 500;">설정</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
